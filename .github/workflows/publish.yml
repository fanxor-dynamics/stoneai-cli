# Publishes @stoneai/cli to npm via OIDC Trusted Publishing.
# No long-lived NPM_TOKEN is used. npm validates the GitHub OIDC identity and
# emits provenance for the published artifact.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, e.g. v0.1.6'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    name: Publish to npm (OIDC)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@stoneai/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: npm ci
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_REF="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          TAG_VERSION="${RELEASE_REF#v}"
          echo "package.json: $PKG_VERSION | release tag: $RELEASE_REF"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '${RELEASE_REF}' resolves to '${TAG_VERSION}' but package.json is '${PKG_VERSION}'."
            exit 1
          fi
      - name: Show publish payload
        run: npm publish --dry-run
      - name: Publish
        run: npm publish
