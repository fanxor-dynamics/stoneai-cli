name: Runner Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted:
    name: GitHub-hosted probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner allocated
        shell: bash
        run: |
          set -euo pipefail
          echo "github-hosted runner allocated"
          uname -a
          node --version || true
          npm --version || true
          git --version || true
