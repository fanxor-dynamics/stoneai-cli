name: Runner Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 22.04 probe
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: echo "ubuntu runner allocated"

  macos:
    name: macOS 14 probe
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - run: echo "macos runner allocated"

  windows:
    name: Windows 2022 probe
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - run: echo "windows runner allocated"
