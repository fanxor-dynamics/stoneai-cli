name: Runner Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Organization self-hosted runner probe
    runs-on: [self-hosted, linux, own-ci]
    timeout-minutes: 5
    steps:
      - name: Confirm runner allocation
        run: |
          echo "runner allocated"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
