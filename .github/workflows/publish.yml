# Publishes @stoneai/cli to npm via OIDC Trusted Publishing.
#
# There is no NPM_TOKEN anywhere in this repo or its secrets. GitHub mints a
# short-lived OIDC identity token (that is what `id-token: write` grants), npm
# validates its claims against the Trusted Publisher rule configured on the
# package, and exchanges it for a credential that lives for the length of one
# publish. Nothing long-lived exists to leak or rotate.
#
# Provenance (the "Built and signed on GitHub Actions" badge, a Sigstore
# attestation binding the tarball to this exact commit and workflow run) is
# generated automatically under trusted publishing — the `--provenance` flag is
# not required and is deliberately omitted.
#
# npm-side configuration this file must stay in sync with:
#   Organization:      fanxor-dynamics
#   Repository:        stoneai-cli
#   Workflow filename: publish.yml     <- this file's basename, matched exactly
#   Environment:       npm-publish     <- must match the `environment:` key below
# Renaming this file breaks publishing until the npm rule is updated to match.

name: Publish to npm

on:
  release:
    types: [published]

# Default to read-only; the publish job elevates only what it needs.
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    name: Publish to npm (OIDC)
    needs: test
    runs-on: ubuntu-latest

    # Requires a GitHub Environment named `npm-publish`. Configure it with
    # required reviewers so a release cannot publish without a human approving
    # the run — the human-consent gate this package exists to enforce.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@stoneai/cli

    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for a publish credential

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Runner images ship older npm,
      # so pin forward explicitly rather than relying on the image's version.
      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A GitHub Release can be cut against any tag. If the tag and
      # package.json disagree, the published version silently differs from the
      # release notes — catch it here rather than on the registry, where a
      # version number can never be reused.
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION | release tag: $GITHUB_REF_NAME"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' resolves to '${TAG_VERSION}' but package.json is '${PKG_VERSION}'."
            exit 1
          fi

      # Confirms the tarball contains exactly the `files` allowlist and nothing
      # else. Publishing is irreversible; this is the last look at the payload.
      - name: Show publish payload
        run: npm publish --dry-run

      # No NODE_AUTH_TOKEN. Credentials come from the OIDC exchange above.
      - name: Publish
        run: npm publish
