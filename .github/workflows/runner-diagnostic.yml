name: Runner Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stone:
    name: Stone self-hosted probe
    runs-on: [self-hosted, stone-ci]
    timeout-minutes: 5
    steps:
      - name: Runner allocated
        shell: bash
        run: |
          set -euo pipefail
          echo "stone-ci runner allocated"
          uname -a
          command -v node || true
          command -v npm || true
          command -v git || true
          command -v docker || true
